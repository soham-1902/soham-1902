<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — AI/ML: PyTorch, HuggingFace, LangChain, OpenAI API, RAG, Agents. Mobile: Flutter, Dart, Firebase. Backend: Python, FastAPI, Docker, C++, Java.">
<defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;font-size:13.5px;fill:#C9C9C9}
  .label{font-size:11px;letter-spacing:2.5px;fill:#575757}
  @keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  .col1{animation:up .8s cubic-bezier(.2,.7,.2,1) .2s both}
  .col2{animation:up .8s cubic-bezier(.2,.7,.2,1) .4s both}
  .col3{animation:up .8s cubic-bezier(.2,.7,.2,1) .6s both}
  .t1{animation:breathe 3.6s ease-in-out infinite}
  .t2{animation:breathe 3.6s ease-in-out .6s infinite}
  .t3{animation:breathe 3.6s ease-in-out 1.2s infinite}
</style>
</defs>

<rect x="0.5" y="0.5" width="899" height="229" rx="16" fill="#0A0A0A" stroke="#1C1C1C"/>

<text class="sans" x="48" y="62" font-size="11" letter-spacing="3.5" fill="#5C5C5C">STACK — TOOLS I ACTUALLY USE</text>

<g class="col1">
  <rect class="t1" x="48" y="94" width="2" height="11" fill="#5EEAD4"/>
  <text class="sans label" x="60" y="104">AI / ML</text>
  <text class="mono" x="48" y="134">PyTorch · HuggingFace</text>
  <text class="mono" x="48" y="160">LangChain · OpenAI API</text>
  <text class="mono" x="48" y="186">RAG · Agents · Fine-tuning</text>
</g>

<g class="col2">
  <rect class="t2" x="368" y="94" width="2" height="11" fill="#5EEAD4"/>
  <text class="sans label" x="380" y="104">MOBILE</text>
  <text class="mono" x="368" y="134">Flutter · Dart</text>
  <text class="mono" x="368" y="160">Firebase</text>
</g>

<g class="col3">
  <rect class="t3" x="618" y="94" width="2" height="11" fill="#5EEAD4"/>
  <text class="sans label" x="630" y="104">BACKEND &amp; CORE</text>
  <text class="mono" x="618" y="134">Python · FastAPI</text>
  <text class="mono" x="618" y="160">Docker</text>
  <text class="mono" x="618" y="186">C++ · Java · Figma</text>
</g>
</svg>
