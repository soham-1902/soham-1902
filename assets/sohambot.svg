<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SohamBot terminal session — an AI trained on Soham answers whether to hire him">
<defs>
<clipPath id="card"><rect x="0.5" y="0.5" width="899" height="379" rx="16"/></clipPath>
<style>
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;font-size:14px}
  .gate{animation:gate 18s ease infinite}
  @keyframes gate{0%{opacity:0}1.5%,95%{opacity:1}99%,100%{opacity:0}}

  .c1{animation:c1 18s steps(20,end) infinite}
  @keyframes c1{0%,2%{transform:translateX(0)}10%,100%{transform:translateX(290px)}}
  .f2{animation:f2 18s ease infinite}
  @keyframes f2{0%,12%{opacity:0}15%,100%{opacity:1}}
  .c3{animation:c3 18s steps(26,end) infinite}
  @keyframes c3{0%,18%{transform:translateX(0)}28%,100%{transform:translateX(330px)}}
  .c4{animation:c4 18s steps(44,end) infinite}
  @keyframes c4{0%,34%{transform:translateX(0)}48%,100%{transform:translateX(490px)}}
  .c5{animation:c5 18s steps(56,end) infinite}
  @keyframes c5{0%,52%{transform:translateX(0)}66%,100%{transform:translateX(570px)}}
  .f6{animation:f6 18s ease infinite}
  @keyframes f6{0%,70%{opacity:0}74%,100%{opacity:1}}
  .f7{animation:f7 18s ease infinite}
  @keyframes f7{0%,76%{opacity:0}78%,100%{opacity:1}}
  .blink{animation:blink 1.1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</defs>

<rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="#0D0D0D" stroke="#1C1C1C"/>
<circle cx="28" cy="30" r="5.5" fill="#2E2E2E"/>
<circle cx="48" cy="30" r="5.5" fill="#2E2E2E"/>
<circle cx="68" cy="30" r="5.5" fill="#2E2E2E"/>
<text class="mono" x="450" y="34" text-anchor="middle" font-size="12" fill="#525252">sohambot — live session</text>
<line x1="0" y1="56" x2="900" y2="56" stroke="#1A1A1A"/>

<g clip-path="url(#card)">
<g class="gate">

  <text class="mono" x="32" y="104"><tspan fill="#5EEAD4">$</tspan><tspan fill="#E8E8E8" dx="8">ssh soham@sohambot</tspan></text>
  <rect class="c1" x="30" y="90" width="280" height="20" fill="#0D0D0D"/>

  <g class="f2">
    <circle cx="37" cy="130" r="3.5" fill="#5EEAD4"/>
    <text class="mono" x="52" y="135" fill="#6B6B6B">connected — model: soham-v2 · trained on exactly one human</text>
  </g>

  <text class="mono" x="32" y="181"><tspan fill="#5C5C5C">you ›</tspan><tspan fill="#E8E8E8" dx="10">should I hire Soham?</tspan></text>
  <rect class="c3" x="30" y="167" width="320" height="20" fill="#0D0D0D"/>

  <text class="mono" x="32" y="227"><tspan fill="#5EEAD4">bot ›</tspan><tspan fill="#E8E8E8" dx="10">Yes. He ships LLM agents that actually think.</tspan></text>
  <rect class="c4" x="30" y="213" width="480" height="20" fill="#0D0D0D"/>

  <text class="mono" x="86" y="257" fill="#A3A3A3">And he built me to say that — draw your own conclusions.</text>
  <rect class="c5" x="84" y="243" width="560" height="20" fill="#0D0D0D"/>

  <text class="mono f6" x="32" y="301" fill="#5EEAD4">→ ask me anything: soham-1902.github.io/sohambot</text>

  <g class="f7">
    <text class="mono" x="32" y="341" fill="#5EEAD4">$</text>
    <rect class="blink" x="48" y="328" width="8" height="16" fill="#5EEAD4"/>
  </g>

</g>
</g>
</svg>
